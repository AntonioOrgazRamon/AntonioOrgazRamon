    <rect x="429" y="140" width="66" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="462" y="171" font-size="13" class="accent" font-weight="700">PG</text>
    <text x="462" y="206" class="dim" font-size="10">PostgreSQL</text>

    <rect x="505" y="140" width="66" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="538" y="171" font-size="13" font-weight="700">Dk</text>
    <text x="538" y="206" class="dim" font-size="10">Docker</text>

    <rect x="581" y="140" width="66" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="614" y="171" font-size="13" font-weight="700">Lx</text>
    <text x="614" y="206" class="dim" font-size="10">Linux</text>

    <!-- row 3 -->
    <rect x="353" y="218" width="66" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="386" y="248" font-size="12">Git</text>
    <text x="386" y="284" class="dim" font-size="10">Git</text>

    <rect x="429" y="218" width="66" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="462" y="249" font-size="13" class="accent">GH</text>
    <text x="462" y="284" class="dim" font-size="9">GH Actions</text>

