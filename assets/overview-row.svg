    <text x="538" y="249" font-size="12" class="accent">〜</text>
    <text x="538" y="284" class="dim" font-size="9">Tailwind</text>

    <rect x="581" y="218" width="66" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="614" y="249" font-size="13">JS</text>
    <text x="614" y="284" class="dim" font-size="10">JavaScript</text>
