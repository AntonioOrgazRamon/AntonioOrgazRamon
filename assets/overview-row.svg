<svg width="1000" height="290" viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .dim { fill: #8b949e; }
      .fg { fill: #e6edf3; }
      .accent { fill: #3fb950; }
      .card { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1000" height="290" fill="#0d1117"/>

  <!-- col 1: system overview -->
  <rect x="0" y="0" width="322" height="288" rx="6" class="card"/>
  <text x="22" y="32" class="mono fg" font-size="13" font-weight="700" letter-spacing="1">SYSTEM OVERVIEW</text>
  <line x1="22" y1="46" x2="300" y2="46" stroke="#21262d"/>

  <text x="22" y="76" class="mono dim" font-size="11">SPECIALIZATION</text>
  <text x="22" y="94" class="mono fg" font-size="13" font-weight="700">Backend Development</text>

  <text x="22" y="126" class="mono dim" font-size="11">PRIMARY FOCUS</text>
  <text x="22" y="144" class="mono fg" font-size="13" font-weight="700">Architecture &amp; Scalability</text>

  <text x="22" y="176" class="mono dim" font-size="11">CURRENT PROJECTS</text>
  <text x="22" y="194" class="mono fg" font-size="13" font-weight="700">4 private repositories</text>

  <text x="22" y="226" class="mono dim" font-size="11">GOAL</text>
  <text x="22" y="244" class="mono fg" font-size="13" font-weight="700">Build software that solves</text>
  <text x="22" y="262" class="mono fg" font-size="13" font-weight="700">real problems</text>

