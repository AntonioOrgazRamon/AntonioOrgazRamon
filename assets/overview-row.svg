  <!-- col 3: current focus -->
  <rect x="678" y="0" width="322" height="288" rx="6" class="card"/>
  <text x="700" y="32" class="mono fg" font-size="13" font-weight="700" letter-spacing="1">CURRENT FOCUS</text>
  <line x1="700" y1="46" x2="978" y2="46" stroke="#21262d"/>

  <g class="mono fg" font-size="12">
    <circle cx="706" cy="70" r="2.5" class="accent"/>
    <text x="718" y="74">Building scalable APIs</text>

    <circle cx="706" cy="98" r="2.5" class="accent"/>
    <text x="718" y="102">System architecture</text>

    <circle cx="706" cy="126" r="2.5" class="accent"/>
    <text x="718" y="130">AI-assisted development</text>

    <circle cx="706" cy="154" r="2.5" class="accent"/>
    <text x="718" y="158">Automation &amp; DevOps</text>

    <circle cx="706" cy="182" r="2.5" class="accent"/>
