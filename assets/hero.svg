<svg width="1000" height="270" viewBox="0 0 1000 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .dim { fill: #8b949e; }
      .fg { fill: #e6edf3; }
      .accent { fill: #3fb950; }
      .accent-line { stroke: #3fb950; }
    </style>
  </defs>

  <rect width="1000" height="270" fill="#0d1117"/>

  <!-- left: identity -->
  <text x="0" y="46" class="mono dim" font-size="15">Hello, I'm</text>
  <text x="0" y="94" class="fg" font-size="46" font-weight="800" font-family="Arial, Helvetica, sans-serif">Antonio <tspan class="accent">Orgaz</tspan></text>

  <rect x="2" y="112" width="172" height="26" rx="4" fill="#0c2d17" stroke="#238636"/>
  <text x="88" y="129" class="mono accent" font-size="11" text-anchor="middle" letter-spacing="1" font-weight="700">FULL STACK DEVELOPER</text>

  <text x="0" y="168" class="mono dim" font-size="13">I build production-ready software with a focus on</text>
  <text x="0" y="188" class="mono dim" font-size="13">clean architecture, performance and maintainability.</text>

  <text x="0" y="222" class="mono dim" font-size="12">Valencia, Spain&#160;&#160;&#160;&#160;&#160;·&#160;&#160;&#160;&#160;&#160;UTC+2</text>

  <!-- right: status panel -->
  <rect x="530" y="10" width="470" height="250" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="554" y="42" class="mono fg" font-size="13" font-weight="700" letter-spacing="1">SYSTEM STATUS</text>
  <line x1="554" y1="58" x2="976" y2="58" stroke="#21262d"/>

  <text x="554" y="88" class="mono dim" font-size="11" letter-spacing="1">CURRENT STATUS</text>
  <circle cx="558" cy="106" r="4" class="accent"/>
  <text x="570" y="111" class="mono fg" font-size="14" font-weight="700">Open to opportunities</text>

  <text x="976" y="88" class="mono dim" font-size="11" text-anchor="end" letter-spacing="1">MEMBER SINCE</text>
  <text x="976" y="111" class="mono fg" font-size="14" text-anchor="end" font-weight="700">Mar 2024</text>

  <line x1="554" y1="132" x2="976" y2="132" stroke="#21262d"/>

  <text x="554" y="158" class="mono dim" font-size="12">FOCUS</text>
  <text x="976" y="158" class="mono fg" font-size="12" text-anchor="end">Backend · Architecture · AI-assisted eng.</text>

  <text x="554" y="184" class="mono dim" font-size="12">STACK</text>
  <text x="976" y="184" class="mono fg" font-size="12" text-anchor="end">TypeScript · Node.js · PostgreSQL</text>

  <text x="554" y="210" class="mono dim" font-size="12">ACTIVE PROJECTS</text>
  <text x="976" y="210" class="mono fg" font-size="12" text-anchor="end">4 · all private</text>

  <text x="554" y="236" class="mono dim" font-size="12">RESPONSE TIME</text>
  <text x="976" y="236" class="mono fg" font-size="12" text-anchor="end">Usually within 24h</text>
</svg>
