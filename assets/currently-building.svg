<svg width="1000" height="190" viewBox="0 0 1000 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .dim { fill: #8b949e; }
      .fg { fill: #e6edf3; }
      .accent { fill: #3fb950; }
      .card { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1000" height="190" fill="#0d1117"/>

  <!-- card 1 -->
  <rect x="0" y="0" width="322" height="188" rx="6" class="card"/>
  <text x="24" y="34" class="mono fg" font-size="15" font-weight="700">Fenix Viajes</text>
  <text x="24" y="54" class="mono dim" font-size="11">SaaS Platform</text>
  <text x="24" y="86" class="mono dim" font-size="11">Multi-tenant SaaS for travel</text>
  <text x="24" y="103" class="mono dim" font-size="11">agencies: leads, quoting,</text>
  <text x="24" y="120" class="mono dim" font-size="11">catalog and automation.</text>
  <rect x="24" y="148" width="66" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="57" y="162" class="mono dim" font-size="10" text-anchor="middle" letter-spacing="1">PRIVATE</text>
  <circle cx="270" cy="158" r="3" class="accent"/>
  <text x="280" y="162" class="mono accent" font-size="10">In dev</text>

  <!-- card 2 -->
  <rect x="339" y="0" width="322" height="188" rx="6" class="card"/>
  <text x="363" y="34" class="mono fg" font-size="15" font-weight="700">TFG Platform</text>
  <text x="363" y="54" class="mono dim" font-size="11">Operations System</text>
  <text x="363" y="86" class="mono dim" font-size="11">Final-degree engineering</text>
  <text x="363" y="103" class="mono dim" font-size="11">project with a documented</text>
  <text x="363" y="120" class="mono dim" font-size="11">architecture and design system.</text>
  <rect x="363" y="148" width="66" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="396" y="162" class="mono dim" font-size="10" text-anchor="middle" letter-spacing="1">PRIVATE</text>
  <circle cx="609" cy="158" r="3" class="accent"/>
  <text x="619" y="162" class="mono accent" font-size="10">In dev</text>

  <!-- card 3 -->
  <rect x="678" y="0" width="322" height="188" rx="6" class="card"/>
  <text x="702" y="34" class="mono fg" font-size="15" font-weight="700">Chat &amp; Geo</text>
  <text x="702" y="54" class="mono dim" font-size="11">Real-time Platform</text>
  <text x="702" y="86" class="mono dim" font-size="11">Location-aware chat with</text>
  <text x="702" y="103" class="mono dim" font-size="11">an admin panel and a</text>
  <text x="702" y="120" class="mono dim" font-size="11">documented deployment flow.</text>
  <rect x="702" y="148" width="62" height="20" rx="10" fill="#0c2d17" stroke="#238636"/>
  <text x="733" y="162" class="mono accent" font-size="10" text-anchor="middle" letter-spacing="1">PUBLIC</text>
  <circle cx="946" cy="158" r="3" fill="#8b949e"/>
  <text x="956" y="162" class="mono dim" font-size="10">Stable</text>
</svg>
